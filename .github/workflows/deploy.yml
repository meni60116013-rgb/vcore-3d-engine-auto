name: VCORE 3D Validation and Source Bundle

on:
  push:
    branches: [main, "audit/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vcore-3d-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"

      - name: Validate JavaScript syntax
        run: node --check src/geometryEngine.js

      - name: Run engine and contract tests
        run: npm test

      - name: Install pinned Playwright for browser tests
        run: npm install --no-save --package-lock=false playwright@1.56.1

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium

      - name: Run CAD browser workflow tests
        run: npm run test:browser

      - name: Validate JSON manifests
        run: |
          node -e "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8'))"
          node -e "JSON.parse(require('node:fs').readFileSync('manifest.json', 'utf8'))"

      - name: Package only required source files
        run: |
          set -eu
          mkdir -p dist
          tar -czf dist/vcore-3d-engine-source.tar.gz index.html manifest.json package.json sw.js src test README.md docs/TECHNICAL_LIMITS.md
          tar -tzf dist/vcore-3d-engine-source.tar.gz >/dev/null
          sha256sum dist/vcore-3d-engine-source.tar.gz | tee dist/SHA256SUMS

      - name: Upload source bundle
        uses: actions/upload-artifact@v7.0.2
        with:
          name: vcore-3d-engine-source
          path: |
            dist/vcore-3d-engine-source.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
