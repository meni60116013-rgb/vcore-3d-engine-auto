name: End-to-End Auto Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Pruebas Unitarias
        run: npm test
      - name: Empaquetar PWA
        uses: actions/upload-artifact@v4
        with:
          name: vcore-pwa-dist
          path: .
